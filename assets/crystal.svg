    <radialGradient id="halo">
      <stop stop-color="#74BAF5" stop-opacity=".18"/>
      <stop offset=".57" stop-color="#7E9DF4" stop-opacity=".06"/>
      <stop offset="1" stop-color="#7E9DF4" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="ground">
      <stop stop-color="#ADDEFF" stop-opacity=".19"/>
      <stop offset=".35" stop-color="#75C5F2" stop-opacity=".07"/>
      <stop offset="1" stop-color="#75C5F2" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="3"/>
    </filter>
  </defs>

  <ellipse cx="302" cy="335" rx="258" ry="299" fill="url(#halo)"/>
  <ellipse cx="305" cy="572" rx="211" ry="38" fill="url(#ground)"/>
  <ellipse cx="305" cy="577" rx="129" ry="11" fill="#11162C" fill-opacity=".23"/>

  <!-- The smaller crystals sit behind the main prism. -->
  <g stroke="url(#edge)" stroke-width=".9" stroke-linejoin="round">
