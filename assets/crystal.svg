<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 650" fill="none">
  <defs>
    <linearGradient id="core" x1="238" y1="97" x2="361" y2="546" gradientUnits="userSpaceOnUse">
      <stop stop-color="#DAFAFF" stop-opacity=".92"/>
      <stop offset=".24" stop-color="#74C4E5" stop-opacity=".48"/>
      <stop offset=".57" stop-color="#858BF0" stop-opacity=".34"/>
      <stop offset="1" stop-color="#86E8F0" stop-opacity=".62"/>
    </linearGradient>
    <linearGradient id="left" x1="165" y1="233" x2="295" y2="480" gradientUnits="userSpaceOnUse">
      <stop stop-color="#B7F7FF" stop-opacity=".8"/>
      <stop offset=".36" stop-color="#3185B4" stop-opacity=".22"/>
      <stop offset=".72" stop-color="#8A91D2" stop-opacity=".5"/>
      <stop offset="1" stop-color="#DBF5FF" stop-opacity=".83"/>
    </linearGradient>
    <linearGradient id="right" x1="308" y1="146" x2="403" y2="540" gradientUnits="userSpaceOnUse">
      <stop stop-color="#E4E2FF" stop-opacity=".84"/>
      <stop offset=".22" stop-color="#B9ACFF" stop-opacity=".57"/>
      <stop offset=".56" stop-color="#608BBB" stop-opacity=".14"/>
      <stop offset="1" stop-color="#77B7EC" stop-opacity=".65"/>
    </linearGradient>
    <linearGradient id="cap" x1="220" y1="95" x2="346" y2="244" gradientUnits="userSpaceOnUse">
      <stop stop-color="#F3FDFF"/>
      <stop offset=".48" stop-color="#9DDAF5" stop-opacity=".7"/>
      <stop offset="1" stop-color="#83AAF0" stop-opacity=".2"/>
    </linearGradient>
    <linearGradient id="edge" x1="220" y1="100" x2="351" y2="559" gradientUnits="userSpaceOnUse">
      <stop stop-color="#F2FCFF" stop-opacity=".96"/>
      <stop offset=".4" stop-color="#BBE7FF" stop-opacity=".22"/>
      <stop offset=".74" stop-color="#9DE8FF" stop-opacity=".72"/>
      <stop offset="1" stop-color="#BDBDFF" stop-opacity=".25"/>
    </linearGradient>
    <linearGradient id="side-a" x1="103" y1="292" x2="267" y2="553" gradientUnits="userSpaceOnUse">
      <stop stop-color="#D9FFFF" stop-opacity=".94"/>
      <stop offset=".34" stop-color="#69C9D9" stop-opacity=".28"/>
      <stop offset=".7" stop-color="#597CA9" stop-opacity=".4"/>
      <stop offset="1" stop-color="#9BCFEA" stop-opacity=".7"/>
    </linearGradient>
    <linearGradient id="side-b" x1="460" y1="287" x2="349" y2="559" gradientUnits="userSpaceOnUse">
      <stop stop-color="#E2DEFF" stop-opacity=".9"/>
      <stop offset=".35" stop-color="#B4A8F5" stop-opacity=".37"/>
      <stop offset=".7" stop-color="#86B8EF" stop-opacity=".21"/>
      <stop offset="1" stop-color="#B7F5FF" stop-opacity=".68"/>
    </linearGradient>
    <linearGradient id="sheen" x1="197" y1="251" x2="352" y2="429" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFF" stop-opacity="0"/>
      <stop offset=".48" stop-color="#ECFFFF" stop-opacity=".27"/>
      <stop offset=".51" stop-color="#FFF" stop-opacity=".02"/>
      <stop offset="1" stop-color="#C4AFFF" stop-opacity=".2"/>
