    <path d="m158 374 72 126-37-102z" fill="#DDFEFF" fill-opacity=".13" stroke="none"/>
    <path d="m460 283 27 78-77 182-67 20-26-58 84-192z" fill="url(#side-b)"/>
    <path d="m460 283-16 87-43-57z" fill="#F2EFFF" fill-opacity=".45"/>
    <path d="m460 283 27 78-43 9z" fill="#C6C4FF" fill-opacity=".25"/>
    <path d="m444 370-101 193-26-58 84-192z" fill="url(#side-b)"/>
    <path d="m487 361-77 182-67 20 101-193z" fill="#9FBAF9" fill-opacity=".24"/>
    <path d="m444 370-50 123 68-126z" fill="#E0DDFF" fill-opacity=".13" stroke="none"/>
  </g>

  <!-- Six distinct faces give the central crystal its depth. -->
  <g stroke="url(#edge)" stroke-width="1.05" stroke-linejoin="round">
    <path d="m268 77 88 94 41 301-51 85-95-14-61-82-10-259z" fill="url(#core)"/>
    <path d="m268 77-88 125 77 48z" fill="url(#cap)"/>
    <path d="m268 77-11 173 62-44 37-35z" fill="url(#cap)"/>
    <path d="m180 202 10 259 61 82 6-293z" fill="url(#left)"/>
    <path d="m257 250-6 293 95 14-27-351z" fill="url(#core)"/>
    <path d="m319 206 27 351 51-85-41-301z" fill="url(#right)"/>
    <path d="m190 461 67-211-6 293z" fill="#88CDE6" fill-opacity=".09"/>
    <path d="m257 250 89 307-27-351z" fill="url(#sheen)" stroke="none"/>
    <path d="m180 202 20 151 57-103z" fill="#D8FAFF" fill-opacity=".12" stroke="none"/>
    <path d="m319 206 78 266-36-51z" fill="#D3CCFF" fill-opacity=".11" stroke="none"/>
    <path d="m251 543 46-84 49 98z" fill="#C9EDFF" fill-opacity=".16"/>
    <path d="m190 461 61 82 46-84-41-44z" fill="#BBFFFF" fill-opacity=".06"/>
  </g>

  <!-- Fine internal refractions and bright, restrained edge glints. -->
  <g stroke-linecap="round">
    <path d="m271 102-9 140m-72-24 7 166m126-158 14 178" stroke="#E8FAFF" stroke-opacity=".35" stroke-width="1.2"/>
    <path d="m275 261 5 199m-53-171-7 139m125-105 18 128" stroke="#DAEFFF" stroke-opacity=".14" stroke-width=".7"/>
    <path d="m201 342 45 29m28 37 40 18m-29-139 19 8m38 78 25 16" stroke="#DDEEFF" stroke-opacity=".16" stroke-width=".65"/>
    <path d="m268 77-40 57m-48 68 77 48m62-44 15 189m10 163 37-60" stroke="#DAF9FF" stroke-opacity=".75" stroke-width="1.3"/>
    <path d="m111 290 27 48m322-55-10 52" stroke="#EAFDFF" stroke-opacity=".82" stroke-width="1.2"/>
    <path d="m268 66 0 22m-11-11h22" stroke="#D9F8FF" stroke-opacity=".55" stroke-width="2" filter="url(#glow)"/>
    <path d="m268 69 0 16m-8-8h16" stroke="#EFFCFF" stroke-opacity=".92" stroke-width=".8"/>
    <path d="m257 241 0 18m-9-9h18" stroke="#E6FDFF" stroke-opacity=".6" stroke-width=".7"/>
    <path d="m381 476 0 12m-6-6h12" stroke="#E9F4FF" stroke-opacity=".65" stroke-width=".7"/>
  </g>
  <g fill="#D4EFFF">
    <circle cx="127" cy="210" r="1.4" fill-opacity=".62"/>
    <circle cx="430" cy="160" r="1" fill-opacity=".44"/>
    <circle cx="477" cy="452" r="1.1" fill-opacity=".55"/>
    <circle cx="142" cy="476" r=".9" fill-opacity=".4"/>
  </g>
</svg>
